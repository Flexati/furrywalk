# ─── Passeggiata Furba — Android APK Build ───
# Genera APK Android debug testabile tramite GitHub Actions.
# Avvia manualmente da Actions → "Build Android APK" → Run workflow
# APK scaricabile come artifact a fine build.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm tsc --noEmit

      - name: Expo Prebuild Android
        run: |
          yes | npx expo prebuild --platform android
        env:
          CI: true

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (Debug)
        if: ${{ github.event.inputs.build_type == 'debug' || !github.event.inputs.build_type }}
        run: |
          cd android
          ./gradlew assembleDebug
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a"

      - name: Build APK (Release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a"

      - name: Find APK file
        id: find-apk
        run: |
          BUILD_TYPE=${{ github.event.inputs.build_type || 'debug' }}
          APK_PATH=$(find android/app/build/outputs/apk -name "app-${BUILD_TYPE}.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK found at: $APK_PATH"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: passeggiata-furba-${{ github.event.inputs.build_type || 'debug' }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      - name: Build summary
        run: |
          APK_SIZE=$(du -h "${{ steps.find-apk.outputs.apk_path }}" | cut -f1)
          echo "### ✅ APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Tipo**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dimensione**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Architetture**: armeabi-v7a, arm64-v8a" >> $GITHUB_STEP_SUMMARY
          echo "- **Scarica**: Artifact 'passeggiata-furba-${{ github.event.inputs.build_type || 'debug' }}'" >> $GITHUB_STEP_SUMMARY
