name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo build"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release
      version_code:
        description: "versionCode"
        required: true
        default: "6"
        type: string
  push:
    branches:
      - main

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_TARGET_SDK: "35"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_MIN_SDK: "24"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm tsc --noEmit

  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Expo Prebuild
        run: yes | npx expo prebuild --platform android --clean
        env:
          CI: "true"
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: R8 ProGuard keep rules
        run: |
          mkdir -p android/app
          cat >> android/app/proguard-rules.pro << 'PROGUARD'
# Keep expo.modules for R8 minifier (ImagePicker)
-keep interface expo.modules.kotlin.services.** { *; }
-keep class expo.modules.imagepicker.** { *; }
-keep class expo.modules.kotlin.** { *; }
PROGUARD
          echo "ProGuard keep rules added"
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          echo "Keystore: $(wc -c < android/app/release.jks) bytes"
      - name: Configure signing
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_FILE=release.jks" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${KEY_PASSWORD}" >> android/gradle.properties
      - name: Build Release AAB
        run: |
          cd android
          set -o pipefail
          ./gradlew bundleRelease -PversionCode=${{ github.event.inputs.version_code || '6' }} --stacktrace 2>&1 | tee /tmp/gradle.log | tail -100
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a"
      - name: Find AAB
        id: find-aab
        run: |
          AAB=$(find android -name "*.aab" -type f | head -1)
          if [ -z "$AAB" ]; then echo "No AAB found"; find android -type f \( -name "*.aab" -o -name "*.apk" \) 2>/dev/null; exit 1; fi
          echo "aab_path=$AAB" >> $GITHUB_OUTPUT
          echo "AAB: $AAB ($(du -h "$AAB" | cut -f1))"
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: passeggiata-furba-release-aab-vc${{ github.event.inputs.version_code || '6' }}
          path: ${{ steps.find-aab.outputs.aab_path }}
          retention-days: 90

  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Expo Prebuild
        run: yes | npx expo prebuild --platform android --clean
        env:
          CI: "true"
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -PversionCode=${{ github.event.inputs.version_code || '6' }}
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a"
      - name: Find APK
        id: find-apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: passeggiata-furba-debug-apk-vc${{ github.event.inputs.version_code || '6' }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 14
