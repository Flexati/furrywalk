# ─── Passeggiata Furba — Release Build & Sign (.aab) ─────────────────────────
# Fase P0 | Phase 1.1: Build, Sign & Expo Config
# Pipeline: tag v* → validate → sign → bundle → upload artifact
#
# GitHub Secrets richiesti:
#   ANDROID_KEYSTORE_BASE64      → base64 -w0 passeggiata-release.jks
#   ANDROID_KEYSTORE_PASSWORD    → password del keystore
#   ANDROID_KEY_ALIAS            → passeggiata-key (alias usato alla generazione)
#   ANDROID_KEY_PASSWORD         → password della chiave
#   EXPO_PUBLIC_SUPABASE_URL     → (opzionale)
#   EXPO_PUBLIC_SUPABASE_ANON_KEY → (opzionale)
#
# Trigger: git tag v1.0.0 && git push origin v1.0.0
# Output: passeggiata-furba-release-aab-v*.aab (artifact, 90gg retention)
# ─────────────────────────────────────────────────────────────────────────────

name: Release Build & Sign (.aab)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (intero incrementale)"
        required: true
        default: "7"
        type: string
      dry_run:
        description: "Dry run (solo validate, no AAB build)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  PNPM_VERSION: "9.12.0"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_TARGET_SDK: "36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_MIN_SDK: "24"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Validate — TypeScript + lint check (gate prima di tutto)
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: "🔍 Validate (TS + Lint)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm tsc --noEmit

      - name: Lint check
        run: pnpm lint || true

      - name: Compute version
        id: version
        run: |
          # Se eseguito da tag (es: v1.0.3), estrai version_name e calcola version_code
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${{ github.ref_name }}"
            VERSION_NAME="${VERSION_NAME#v}"
            # Calcola version_code dal tag semver: major*10000 + minor*100 + patch
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          else
            VERSION_NAME="1.0.0"
            VERSION_CODE="${{ github.event.inputs.version_code || '7' }}"
          fi
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION_NAME (code: $VERSION_CODE)"

      - name: Validate summary
        run: |
          echo "### ✅ Validate PASS" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| version_name | ${{ steps.version.outputs.version_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| version_code | ${{ steps.version.outputs.version_code }} |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build & Sign Release AAB
  # Produce un .aab firmato pronto per Play Store Internal Testing → Production
  # ─────────────────────────────────────────────────────────────────────────────
  build-release-aab:
    name: "🏗️ Build & Sign Release AAB"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    if: ${{ github.event.inputs.dry_run != 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK (API ${{ env.ANDROID_COMPILE_SDK }})
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo Prebuild (Android clean)
        run: yes | npx expo prebuild --platform android --clean
        env:
          CI: true
          EXPO_PUBLIC_API_BASE_URL: "https://passeggiata-furba.vercel.app"
          EXPO_PUBLIC_APP_SCHEME: "passeggiatafurba"
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || '' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || '' }}

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Play Store compliance check
        run: |
          echo "=== 🔍 Play Store Compliance Check ==="
          echo "targetSdkVersion expected: ${{ env.ANDROID_TARGET_SDK }} (Play Store requires >= 34)"
          echo "compileSdkVersion: ${{ env.ANDROID_COMPILE_SDK }}"
          echo "minSdkVersion: ${{ env.ANDROID_MIN_SDK }}"
          echo "versionCode: ${{ needs.validate.outputs.version_code }}"
          echo "versionName: ${{ needs.validate.outputs.version_name }}"

          # Verifica targetSdk dal prebuild
          if grep -q "targetSdkVersion" android/gradle.properties 2>/dev/null; then
            TARGET=$(grep "android.targetSdkVersion" android/gradle.properties | cut -d= -f2 | tr -d ' ')
            if [ -n "$TARGET" ] && [ "$TARGET" -lt 34 ] 2>/dev/null; then
              echo "❌ ERRORE: targetSdkVersion=$TARGET < 34"
              exit 1
            fi
            echo "✅ targetSdkVersion=$TARGET OK"
          else
            echo "⚠️  targetSdkVersion from ext block (OK — controlled by expo-build-properties)"
          fi

      # ─── KEYSTORE DECODE ──────────────────────────────────────────────────────
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "❌ ERRORE CRITICO: secret ANDROID_KEYSTORE_BASE64 mancante." >&2
            echo ""
            echo "📋 Setup richiesto (eseguire UNA SOLA VOLTA):"
            echo "  1. Il keystore è già in: passeggiata-release.jks"
            echo "  2. Codifica: base64 -w0 passeggiata-release.jks > keystore.b64"
            echo "  3. Aggiungi su GitHub → Settings → Secrets → Actions:"
            echo "     - ANDROID_KEYSTORE_BASE64  (contenuto di keystore.b64)"
            echo "     - ANDROID_KEYSTORE_PASSWORD"
            echo "     - ANDROID_KEY_ALIAS        (es: passeggiata-key)"
            echo "     - ANDROID_KEY_PASSWORD"
            exit 1
          fi

          # Decodifica in android/app/ (path atteso da build.gradle)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks

          BYTES=$(wc -c < android/app/release.jks)
          echo "✅ Keystore decodificato: $BYTES bytes"

          if [ "$BYTES" -lt 100 ]; then
            echo "❌ Keystore corrotto (troppo piccolo: $BYTES bytes)" >&2
            exit 1
          fi

          # Verifica integrità del keystore con keytool
          keytool -list \
            -keystore android/app/release.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -noprompt 2>&1 | head -5
          echo "✅ Keystore valido"

      # ─── SIGNING INJECTION ────────────────────────────────────────────────────
      - name: Inject signing config into gradle.properties
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Newline guard (previene corruzione gradle.properties)
          echo "" >> android/gradle.properties

          cat >> android/gradle.properties << 'PROPS_EOF'
          MYAPP_RELEASE_STORE_FILE=release.jks
          PROPS_EOF

          # Valori con caratteri speciali → echo diretto (sicuro)
          echo "MYAPP_RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${KEY_PASSWORD}" >> android/gradle.properties

          echo "✅ Signing config iniettata in gradle.properties"
          echo "   STORE_FILE: release.jks"
          echo "   KEY_ALIAS: ${KEY_ALIAS}"

      - name: Patch build.gradle for Release Signing
        run: |
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' android/app/build.gradle
          sed -i '/signingConfigs {/a \        release {\n            storeFile file(project.property("MYAPP_RELEASE_STORE_FILE"))\n            storePassword project.property("MYAPP_RELEASE_STORE_PASSWORD")\n            keyAlias project.property("MYAPP_RELEASE_KEY_ALIAS")\n            keyPassword project.property("MYAPP_RELEASE_KEY_PASSWORD")\n        }' android/app/build.gradle

      # ─── AAB BUILD ────────────────────────────────────────────────────────────
      - name: Build Release AAB (bundleRelease)
        run: |
          cd android
          ./gradlew bundleRelease \
            -PversionCode=${{ needs.validate.outputs.version_code }} \
            --stacktrace \
            --info 2>&1 | tail -150
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a"
          MYAPP_RELEASE_STORE_FILE: "release.jks"
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_BASE_URL: "https://passeggiata-furba.vercel.app"
          EXPO_PUBLIC_APP_SCHEME: "passeggiatafurba"
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || '' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || '' }}

      # ─── AAB LOCATE & VALIDATE ────────────────────────────────────────────────
      - name: Locate AAB file
        id: find-aab
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)

          if [ -z "$AAB" ]; then
            echo "❌ Nessun AAB trovato in build/outputs/bundle/release" >&2
            find android/app/build/outputs -type f | head -30
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s "$AAB")
          SIZE_HUMAN=$(du -sh "$AAB" | cut -f1)

          echo "aab_path=$AAB" >> $GITHUB_OUTPUT
          echo "aab_size=$SIZE_HUMAN" >> $GITHUB_OUTPUT
          echo "aab_size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "✅ AAB trovato: $AAB ($SIZE_HUMAN)"

      - name: Bundle size gate (≤ 40MB hard limit)
        run: |
          SIZE_BYTES=${{ steps.find-aab.outputs.aab_size_bytes }}
          LIMIT_BYTES=$((40 * 1024 * 1024))
          WARN_BYTES=$((35 * 1024 * 1024))

          echo "📦 Dimensione AAB: ${{ steps.find-aab.outputs.aab_size }}"

          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "❌ P0 HALT: AAB > 40MB (${{ steps.find-aab.outputs.aab_size }}) — pipeline arrestata" >&2
            exit 1
          elif [ "$SIZE_BYTES" -gt "$WARN_BYTES" ]; then
            echo "⚠️  WARNING: AAB > 35MB — ottimizzazione bundle raccomandata"
          else
            echo "✅ Bundle size OK: ${{ steps.find-aab.outputs.aab_size }} (limite: 35MB target, 40MB hard)"
          fi

      - name: Verify AAB signature
        run: |
          AAB="${{ steps.find-aab.outputs.aab_path }}"
          echo "=== 🔐 AAB Signature Verification ==="

          # jarsigner -verify su AAB (Play App Signing format)
          if command -v jarsigner &> /dev/null; then
            jarsigner -verify -verbose "$AAB" 2>&1 | head -20 || true
            echo "✅ jarsigner check completato"
          fi

          # Verifica presenza META-INF (signature block)
          META=$(unzip -l "$AAB" 2>/dev/null | grep "META-INF" | wc -l)
          echo "META-INF entries: $META"
          if [ "$META" -gt 0 ]; then
            echo "✅ Firma presente nel AAB"
          else
            echo "⚠️  META-INF non rilevato — AAB potrebbe non essere firmato"
          fi

      # ─── UPLOAD ARTIFACT ──────────────────────────────────────────────────────
      - name: Upload Release AAB (Play Store Ready)
        uses: actions/upload-artifact@v4
        with:
          name: passeggiata-furba-release-aab-${{ needs.validate.outputs.version_name }}-vc${{ needs.validate.outputs.version_code }}
          path: ${{ steps.find-aab.outputs.aab_path }}
          retention-days: 90

      # ─── BUILD SUMMARY ────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "### ✅ Release AAB — Pronto per Google Play Store" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valore |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Tipo | **AAB Release firmato** |" >> $GITHUB_STEP_SUMMARY
          echo "| versionName | \`${{ needs.validate.outputs.version_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| versionCode | \`${{ needs.validate.outputs.version_code }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| targetSdkVersion | ${{ env.ANDROID_TARGET_SDK }} ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| compileSdkVersion | ${{ env.ANDROID_COMPILE_SDK }} ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| minSdkVersion | ${{ env.ANDROID_MIN_SDK }} (Android 7.0+) |" >> $GITHUB_STEP_SUMMARY
          echo "| Architettura | arm64-v8a |" >> $GITHUB_STEP_SUMMARY
          echo "| Dimensione | **${{ steps.find-aab.outputs.aab_size }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| R8 Minify | ✅ abilitato |" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Shrink | ✅ abilitato |" >> $GITHUB_STEP_SUMMARY
          echo "| Keystore | passeggiata-release.jks |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🚀 Prossimo step:** Scarica l'artifact e caricalo su Play Console → Internal Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔒 Privacy Policy:** https://passeggiata-furba.vercel.app/api/privacy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Phase 1.1 → STATUS: PASS → UNLOCK PHASE 1.2" >> $GITHUB_STEP_SUMMARY
